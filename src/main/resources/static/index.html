<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
</head>
<body>
    <h1>Authentication Test</h1>
    
    <div style="display: flex; gap: 50px;">
        <!-- Login Form -->
        <div>
            <h2>Login</h2>
            <form id="loginForm">
                <div>
                    <label>Username:</label>
                    <input type="text" id="loginUsername" required>
                </div>
                <div>
                    <label>Password:</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <div id="loginResult"></div>
        </div>

        <!-- Register Form -->
        <div>
            <h2>Register</h2>
            <form id="registerForm">
                <div>
                    <label>Username:</label>
                    <input type="text" id="regUsername" required>
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div>
                    <label>Password:</label>
                    <input type="password" id="regPassword" required>
                </div>
                <button type="submit">Register</button>
            </form>
            <div id="registerResult"></div>
        </div>
    </div>

    <!--Account Creation Form-->
    <div>
    <h2>Create Bank Account</h2>
    <form id="createAccountForm">
        <div>
            <label>User ID:</label>
            <input type="number" id="createAccountUserId" required>
        </div>
        <button type="submit">Create Account</button>
    </form>
    <div id="createAccountResult"></div>
</div>

    <script>
    // Login form handler
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        
        try {
            const response = await fetch('/api/auth/login', { // Remove localhost:8080
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });
            
            const result = await response.json();
            const resultDiv = document.getElementById('loginResult');
            
            if (response.ok) {
                resultDiv.innerHTML = `<p style="color: green;">Success: ${result.message}</p>`;
                resultDiv.innerHTML += `<p>Welcome, ${result.username}!</p>`;
            } else {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${result.error}</p>`;
            }
        } catch (error) {
            document.getElementById('loginResult').innerHTML = `<p style="color: red;">Network Error: ${error.message}. Check if server is running.</p>`;
        }
    });

    // Register form handler - similar update
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('regUsername').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        
        try {
            const response = await fetch('/api/auth/register', { // Remove localhost:8080
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, email, password })
            });
            
            const result = await response.json();
            const resultDiv = document.getElementById('registerResult');
            
            if (response.ok) {
                resultDiv.innerHTML = `<p style="color: green;">Success: ${result.message}</p>`;
                resultDiv.innerHTML += `<p>User ID: ${result.userId}</p>`;
                resultDiv.innerHTML += `<p>Username: ${result.username}</p>`;
            } else {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${result.error}</p>`;
            }
        } catch (error) {
            document.getElementById('registerResult').innerHTML = `<p style="color: red;">Network Error: ${error.message}. Check if server is running.</p>`;
        }
    });

    // Create Account form handler
document.getElementById('createAccountForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const userId = document.getElementById('createAccountUserId').value;
    
    try {
        const response = await fetch(`/api/accounts/create?userId=${userId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        });
        
        const result = await response.json();
        const resultDiv = document.getElementById('createAccountResult');
        
        if (response.ok) {
            resultDiv.innerHTML = `<p style="color: green;">Success: ${result.message}</p>`;
            resultDiv.innerHTML += `<p>Account Number: ${result.accountNumber}</p>`;
            resultDiv.innerHTML += `<p>Initial Balance: ${result.balance}</p>`;
        } else {
            resultDiv.innerHTML = `<p style="color: red;">Error: ${result.error}</p>`;
        }
    } catch (error) {
        document.getElementById('createAccountResult').innerHTML = `<p style="color: red;">Network Error: ${error.message}. Check if server is running.</p>`;
    }
});
</script>
</html>
